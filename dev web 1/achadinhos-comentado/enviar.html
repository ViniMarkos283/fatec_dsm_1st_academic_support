<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar achadinho - Achadinhos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html#inicio">Achadinhos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#inicio">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
            <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre nós</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="enviar.html">Enviar achadinho</a></li>
          </ul>
          <button id="btn-tema" class="btn btn-outline-secondary btn-sm ms-md-3 mt-2 mt-md-0">🌙 Modo escuro</button>
        </div>
      </div>
    </nav>
  </header>

  <main>

    <section class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <h1 class="h2">Envie seu achadinho</h1>
          <p>Preencha o formulário abaixo. Se o achado passar na conferência de preço, ele entra na lista da semana.</p>

          <form action="obrigado.html" method="get">
          <div class="mb-3">
            <label for="nome" class="form-label">Seu nome ou apelido:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail:</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="produto" class="form-label">Nome do produto:</label>
            <input type="text" id="produto" name="produto" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="link" class="form-label">Link do produto:</label>
            <input type="url" id="link" name="link" class="form-control" placeholder="https://" required>
          </div>
          <div class="mb-3">
            <label for="categoria" class="form-label">Categoria:</label>
            <select id="categoria" name="categoria" class="form-select" required>
              <option value="">Escolha uma categoria</option>
              <option>Casa</option>
              <option>Tech</option>
              <option>Beleza</option>
              <option>Moda</option>
              <option>Cozinha</option>
              <option>Pet</option>
              <option>Outra</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="preco" class="form-label">Preço encontrado (R$):</label>
            <input type="number" id="preco" name="preco" class="form-control" min="0" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="loja" class="form-label">Loja:</label>
            <input type="text" id="loja" name="loja" class="form-control" placeholder="Ex.: Shopee, Mercado Livre, Amazon...">
          </div>
          <div class="mb-3">
            <label for="descricao" class="form-label">Por que vale a pena? (opcional)</label>
            <textarea id="descricao" name="descricao" rows="4" class="form-control"></textarea>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" id="termos" name="termos" class="form-check-input" required>
            <label for="termos" class="form-check-label">Confirmo que o link e o preço informados são reais.</label>
          </div>
          <button type="submit" class="btn btn-primary">Enviar achadinho</button>
          <button type="reset" class="btn btn-outline-secondary">Limpar</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-top py-4 text-center">
    <div class="container">
      <p class="mb-1">&copy; 2026 Achadinhos. Todos os direitos reservados.</p>
      <a href="#" class="me-3">Política de Privacidade</a>
      <a href="#" class="me-3">Termos de Uso</a>
      <a href="enviar.html">Voltar ao topo</a>
    </div>
  </footer>

</body>
</html>
